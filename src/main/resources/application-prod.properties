# Production Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}

# Production PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}

# JWT Production Security
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Storage & Upload Limits
jobtrack.storage.upload-dir=${JOBTRACK_UPLOAD_DIR:uploads/job-applications}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Production CORS Configuration
jobtrack.cors.allowed-origins=${JOBTRACK_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Production Actuator Health Check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# SpringDoc OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
