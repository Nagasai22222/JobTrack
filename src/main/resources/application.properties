# Server configuration
server.port=${PORT:${SERVER_PORT:8080}}


# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtrack_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Nagasai@*123*}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtrack_db}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:Nagasai@*123*}

# JWT Configuration
jwt.secret=${JWT_SECRET:8V7B8Y7V8B87B7BT87BT87B7T8B7BT8B78TBTB78TB7B87TBBT787BT8BT87B7B8V7B8Y7V8B}
jwt.expiration=${JWT_EXPIRATION:3600000}

# File Storage & Multipart Limits
jobtrack.storage.upload-dir=${JOBTRACK_UPLOAD_DIR:uploads/job-applications}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# CORS Configuration
jobtrack.cors.allowed-origins=${JOBTRACK_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
